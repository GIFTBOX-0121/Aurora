<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c22"><title>Aurora - The Dawn - | STARGLOW 1st Arena Tour | UNOFFICIAL</title><style>
:root{color-scheme:dark;--ink:#f6f5ff;--muted:#b4b8d5;--line:rgba(210,215,255,.18);--glass:rgba(17,22,50,.62);--bright:#c5bbff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#050819;min-height:100vh;line-height:1.8;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-25%;z-index:-2;background:radial-gradient(ellipse at 15% 20%,rgba(35,109,169,.34),transparent 42%),radial-gradient(ellipse at 78% 10%,rgba(108,63,171,.38),transparent 42%),radial-gradient(ellipse at 50% 85%,rgba(46,90,143,.24),transparent 48%);animation:aurora 17s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(1px 1px at 14% 12%,#fff 99%,transparent),radial-gradient(1px 1px at 73% 28%,#fff 99%,transparent),radial-gradient(2px 2px at 86% 76%,#d4d6ff 99%,transparent),radial-gradient(1px 1px at 28% 68%,#fff 99%,transparent),radial-gradient(1px 1px at 52% 42%,#fff 99%,transparent);background-size:330px 410px;opacity:.55;animation:twinkle 5s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate(7%,5%) rotate(7deg)}}@keyframes twinkle{to{opacity:.2}}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:4px}
.wrap{width:min(100% - 32px,760px);margin:auto}.topnav{display:flex;justify-content:space-between;align-items:center;padding:24px 0;font-size:12px;letter-spacing:.15em;color:#d7d9f5}.topnav a{border-bottom:1px solid #aab0d5;padding-bottom:3px}
.hero{text-align:center;padding:38px 0 34px}.eyebrow{letter-spacing:.26em;font-size:11px;color:#c6c9e4;font-weight:700}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(47px,10vw,84px);line-height:1.05;font-weight:400;margin:18px 0 10px;letter-spacing:.03em;text-shadow:0 0 34px rgba(177,151,255,.45)}.hero .subtitle{font-size:12px;letter-spacing:.17em;color:#d3d5ee}.hero .desc{color:#c8cbe5;font-size:13px;margin-top:24px}
.art{height:210px;border:1px solid rgba(216,218,255,.28);border-radius:18px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 20% 25%,rgba(117,209,227,.28),transparent 42%),radial-gradient(ellipse at 80% 35%,rgba(177,119,240,.32),transparent 43%),linear-gradient(145deg,#0b1b3a,#231b47 55%,#0b1a35);position:relative;box-shadow:0 16px 60px rgba(0,0,0,.18)}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 25%,rgba(221,220,255,.14) 50%,transparent 75%);transform:skewX(-20deg);animation:shine 9s linear infinite}@keyframes shine{from{translate:-130%}to{translate:130%}}.art span{font-family:Georgia,serif;font-size:36px;letter-spacing:.1em;text-shadow:0 0 28px #b7a2ff}
.section{margin:46px 0}.section h2{font-size:18px;letter-spacing:.14em;margin:0 0 4px;font-weight:700}.section .jp{font-size:11px;color:#adb3d4;margin:0 0 18px}.rule{height:1px;background:linear-gradient(90deg,transparent,#a4a9d0,transparent);margin:38px 0}.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:21px;margin:12px 0;backdrop-filter:blur(12px);box-shadow:0 9px 30px rgba(0,0,0,.08)}.card h3{margin:0 0 10px;font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.pill{display:inline-block;font-size:10px;letter-spacing:.1em;padding:3px 10px;border:1px solid #7f85ac;border-radius:30px;color:#e3e2ff}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:1px solid rgba(210,215,255,.38);background:rgba(142,139,211,.14);color:#fff;border-radius:10px;padding:11px 16px;display:inline-block;text-align:center;font-size:12px;font-weight:700}.btn:hover{background:rgba(142,139,211,.28)}.btn:disabled{opacity:.5;cursor:not-allowed}.textlink{font-size:12px;text-decoration:underline;text-underline-offset:5px;color:#d9d4ff}.date{font-size:11px;color:#a9b5de;letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .card{margin:0}.check{display:flex;align-items:flex-start;gap:10px;font-size:13px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.09)}.check:last-child{border:0}.check input{width:19px;height:19px;accent-color:#b4a5ff;margin-top:3px}.check:has(input:checked) span{color:#a6b3cc}.progress{height:6px;border-radius:10px;background:#353958;overflow:hidden;margin-top:15px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#78b3d7,#c9a2f3);transition:width .3s}.notice{border-left:3px solid #bcb3ff;padding:4px 0 4px 14px;font-size:12px;color:#d4d4eb}.links{display:flex;gap:9px;flex-wrap:wrap}.footer{text-align:center;color:#a8abc9;font-size:11px;padding:48px 0 65px;letter-spacing:.12em}.empty{font-size:13px;color:#b5b8d1}.modal{border:1px solid #71799f;border-radius:20px;background:#111831;color:#fff;width:min(92vw,560px);max-height:84vh;overflow:auto;padding:26px;box-shadow:0 25px 80px #0009}.modal::backdrop{background:#020512c9;backdrop-filter:blur(5px)}.close{float:right;background:none;color:#fff;border:0;font-size:25px}.count{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:#e1d7ff}.tag{font-size:10px;color:#b6c7ec}.track{padding:9px 0;border-bottom:1px solid #ffffff18;font-size:13px}.track:last-child{border:0}
@media(max-width:480px){.grid{grid-template-columns:1fr}.hero{padding-top:25px}.art{height:165px}.art span{font-size:29px}.card{padding:17px}.section{margin:36px 0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="wrap"><header class="topnav"><a href="index.html">← AURORA HOME</a><span>UNOFFICIAL</span></header>
<main>
<section class="hero"><div class="eyebrow">STARGLOW 1st ARENA TOUR</div><h1>Aurora</h1><div class="subtitle">– THE DAWN –</div></section>
<div class="art" aria-label="ツアー画像の仮置き"><span>The Dawn ✧</span></div>
<div class="rule"></div>
<section class="section" id="ticket"><h2>TICKET INFORMATION</h2><p class="jp">チケット先行受付</p><div id="ticketList"></div></section>
<div class="rule"></div>
<section class="section" id="schedule"><h2>TOUR SCHEDULE</h2><p class="jp">ツアー日程・会場・アクセス</p><div id="venueList"></div></section>
<div class="rule"></div>
<section class="section" id="sns"><h2>OFFICIAL SNS</h2><p class="jp">公式アカウント</p><div id="snsLinks" class="links"></div></section>
</main><footer class="footer">UNOFFICIAL FAN SITE<br>本サイトは非公式ファンサイトです。公式運営とは関係ありません。</footer></div>
<dialog class="modal" id="accessModal"><button type="button" class="close" id="closeAccess" aria-label="閉じる">×</button><div class="eyebrow">ACCESS MAP</div><h2 id="accessTitle"></h2><div id="accessBody"></div></dialog>
<script>
// ▼ 情報更新は基本的にこの DATA のみ。
// 未確認の公演日時・会場・所要時間・受付期間は空欄のままにすること。
const DATA={
 tickets:[
 // {name:"○○先行",start:"2026-10-25T12:00:00+09:00",end:"2026-11-08T23:59:59+09:00",url:"https://..."}
 ],
 venues:[
 // 確認した会場をここに追加。例：
 // {id:"venue01",region:"新潟",venue:"正式会場名",address:"正式住所",shows:[{date:"2027-00-00",open:"17:00",start:"18:00"}],station:"最寄り駅",walk:"徒歩○分",majorStation:"主要駅からの行き方",airport:"空港からの行き方",mapUrl:"https://maps.google.com/..."}
 ],
 sns:[] // {name:"X",url:"https://..."}
};
const $=s=>document.querySelector(s);
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const link=(url,label,cls="btn")=>url?.startsWith("https://")?`<a class="${cls}" href="${safe(url)}" target="_blank" rel="noopener noreferrer">${safe(label)}</a>`:"";
const fmt=d=>{const v=new Date(d);return Number.isNaN(+v)?"日時確認中":new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(v)};
function renderTickets(){
 const now=Date.now();
 $("#ticketList").innerHTML=DATA.tickets.length?DATA.tickets.map(t=>{
 const start=Date.parse(t.start),end=Date.parse(t.end);
 const valid=Number.isFinite(start)&&Number.isFinite(end);
 let status="",extra="";
 if(!valid){status="受付期間確認中"}
 else if(now<start){status="受付開始前"}
 else if(now>end){status=`${safe(t.name)}の受付は終了しました`}
 else if(now>=end-24*3600*1000){status="📣 申し込み受付 最終日 ⭐";const ms=end-now;extra=`<div class="count" data-end="${safe(t.end)}">${remaining(ms)}</div>`}
 else{status=`📣 ${safe(t.name)}にてチケット申し込み受付中`}
 return `<article class="card"><span class="pill">TICKET</span><h3 style="margin-top:12px">${status}</h3><p class="small muted">${safe(t.name)}｜${valid?fmt(t.start)+" 〜 "+fmt(t.end):"期間未登録"}</p>${extra}${link(t.url,"詳細はこちら →","textlink")}</article>`
 }).join(""):'<div class="card"><p class="notice">現在、受付情報は未登録です。公式情報を確認後に表示します。</p></div>';
}
function remaining(ms){if(ms<=0)return"受付終了";const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return`締め切りまで 残り ${String(h).padStart(2,"0")}時間 ${String(m).padStart(2,"0")}分 ${String(s).padStart(2,"0")}秒`}
function renderVenues(){
 $("#venueList").innerHTML=DATA.venues.length?DATA.venues.map((v,i)=>`<article class="card"><div class="eyebrow">✧ ${safe(v.region||"会場 "+(i+1))}</div><h3 style="margin-top:12px">${safe(v.venue||"会場名確認中")}</h3>${(v.shows||[]).map(s=>`<div class="track"><strong>${safe(s.date||"日程確認中")}</strong><br><span class="small muted">開場 ${safe(s.open||"未定")} ／ 開演 ${safe(s.start||"未定")}</span></div>`).join("")}<p class="small muted">${safe(v.address||"住所確認中")}</p><button type="button" class="btn" data-access="${safe(v.id)}">MAP・アクセス ↗</button></article>`).join(""):'<div class="card empty">公演日程・会場は公式情報を確認してから登録します。未確認の会場名や日時は掲載していません。</div>';
 document.querySelectorAll("[data-access]").forEach(b=>b.addEventListener("click",()=>openAccess(b.dataset.access)));
}
function openAccess(id){
 const v=DATA.venues.find(x=>x.id===id);if(!v)return;
 $("#accessTitle").textContent="✧ "+(v.region||"")+" "+(v.venue||"");
 $("#accessBody").innerHTML=`<div class="card"><h3>📍 会場</h3><p class="small">${safe(v.venue||"確認中")}<br>${safe(v.address||"住所確認中")}</p><h3>🚃 最寄り駅</h3><p class="small">${safe(v.station||"確認中")}<br>${safe(v.walk||"徒歩時間確認中")}</p><h3>🚄 主要駅から</h3><p class="small">${safe(v.majorStation||"確認中")}</p><h3>✈️ 空港から</h3><p class="small">${safe(v.airport||"確認中")}</p>${link(v.mapUrl,"Google マップで開く ↗")}</div><p class="small muted">アクセス時間は目安です。実際の交通状況をご確認ください。</p>`;
 $("#accessModal").showModal();
}
function renderSNS(){$("#snsLinks").innerHTML=DATA.sns.length?DATA.sns.map(s=>link(s.url,s.name+" ↗")).join(""):'<span class="empty">公式SNSリンクは確認後に追加します。</span>'}
$("#closeAccess").addEventListener("click",()=>$("#accessModal").close());$("#accessModal").addEventListener("click",e=>{if(e.target.id==="accessModal")e.target.close()});
function tick(){renderTickets()}renderVenues();renderSNS();tick();setInterval(tick,1000);
</script></body></html>
