<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>STARGLOW Aurora | Unofficial Fan Site</title>

  <style>

    /* ========================================
       基本設定
       ======================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        Arial,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(143, 181, 255, 0.28),
          transparent 34%
        ),
        radial-gradient(
          circle at 85% 25%,
          rgba(205, 156, 255, 0.22),
          transparent 32%
        ),
        radial-gradient(
          circle at 45% 85%,
          rgba(115, 219, 255, 0.17),
          transparent 38%
        ),
        linear-gradient(
          160deg,
          #101a38 0%,
          #17234c 38%,
          #20285b 67%,
          #10182f 100%
        );

      background-attachment: fixed;

      overflow-x: hidden;
    }


    /* ========================================
       背景の光
       ======================================== */

    .aurora-bg {
      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 0;

      overflow: hidden;
    }

    .aurora-light {
      position: absolute;

      width: 520px;
      height: 520px;

      border-radius: 50%;

      filter: blur(90px);

      opacity: 0.25;

      animation: floatAurora 12s ease-in-out infinite alternate;
    }

    .light-1 {
      top: -180px;
      left: -220px;

      background:
        rgba(115, 186, 255, 0.8);
    }

    .light-2 {
      top: 20%;
      right: -250px;

      background:
        rgba(203, 138, 255, 0.65);

      animation-delay: -4s;
    }

    .light-3 {
      bottom: -240px;
      left: 25%;

      background:
        rgba(97, 233, 220, 0.45);

      animation-delay: -7s;
    }

    @keyframes floatAurora {

      from {
        transform:
          translate3d(-15px, -10px, 0)
          scale(1);
      }

      to {
        transform:
          translate3d(40px, 30px, 0)
          scale(1.12);
      }
    }


    /* ========================================
       ページ
       ======================================== */

    .page {
      position: relative;
      z-index: 1;

      width: min(100%, 760px);

      min-height: 100vh;

      margin: 0 auto;

      padding:
        70px
        20px
        35px;
    }


    /* ========================================
       HEADER
       ======================================== */

    .header {
      text-align: center;

      margin-bottom: 54px;
    }

    .brand {
      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.38em;

      opacity: 0.72;

      margin-bottom: 14px;
    }

    .main-title {
      font-size:
        clamp(38px, 11vw, 66px);

      font-weight: 300;

      letter-spacing: 0.08em;

      line-height: 1;

      margin-bottom: 13px;

      text-shadow:
        0 0 30px
        rgba(190, 215, 255, 0.35);
    }

    .subtitle {
      font-size: 12px;

      letter-spacing: 0.25em;

      opacity: 0.72;
    }


    /* ========================================
       MENU
       ======================================== */

    .menu {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 18px;
    }


    /* ========================================
       CARD
       ======================================== */

    .menu-card {
      position: relative;

      min-height: 320px;

      padding: 28px 24px;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      color: #ffffff;

      text-decoration: none;

      border:
        1px solid
        rgba(255, 255, 255, 0.25);

      border-radius: 24px;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.035)
        );

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        0 20px 45px
        rgba(0, 0, 0, 0.20);

      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .menu-card::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 80% 10%,
          rgba(255, 255, 255, 0.18),
          transparent 35%
        );

      pointer-events: none;
    }

    .menu-card:hover {
      transform:
        translateY(-5px);

      border-color:
        rgba(255, 255, 255, 0.48);

      box-shadow:
        0 25px 55px
        rgba(0, 0, 0, 0.28);
    }

    .card-number {
      position: absolute;

      top: 24px;
      left: 24px;

      font-size: 11px;

      letter-spacing: 0.18em;

      opacity: 0.58;
    }

    .card-label {
      position: relative;

      font-size: 11px;

      letter-spacing: 0.20em;

      opacity: 0.72;

      margin-bottom: 9px;
    }

    .card-title {
      position: relative;

      font-size:
        clamp(24px, 5vw, 34px);

      font-weight: 400;

      line-height: 1.2;

      letter-spacing: 0.02em;

      margin-bottom: 14px;
    }

    .card-subtitle {
      position: relative;

      min-height: 38px;

      font-size: 13px;

      line-height: 1.6;

      opacity: 0.72;

      margin-bottom: 25px;
    }

    .enter {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding-top: 16px;

      border-top:
        1px solid
        rgba(255, 255, 255, 0.18);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.20em;
    }

    .arrow {
      font-size: 20px;

      font-weight: 300;

      transition:
        transform 0.2s ease;
    }

    .menu-card:hover .arrow {
      transform:
        translateX(5px);
    }


    /* ========================================
       Album / Tour の微差
       ======================================== */

    .album-card {
      background:
        radial-gradient(
          circle at 85% 5%,
          rgba(119, 210, 255, 0.22),
          transparent 37%
        ),
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.14),
          rgba(100, 162, 255, 0.05)
        );
    }

    .tour-card {
      background:
        radial-gradient(
          circle at 85% 5%,
          rgba(211, 158, 255, 0.22),
          transparent 37%
        ),
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.14),
          rgba(171, 110, 255, 0.05)
        );
    }


    /* ========================================
       FOOTER
       ======================================== */

    footer {
      text-align: center;

      margin-top: 60px;

      padding-top: 25px;

      border-top:
        1px solid
        rgba(255, 255, 255, 0.14);

      font-size: 11px;

      letter-spacing: 0.08em;

      color:
        rgba(255, 255, 255, 0.58);
    }


    /* ========================================
       スマホ
       ======================================== */

    @media (max-width: 600px) {

      .page {
        padding:
          55px
          16px
          30px;
      }

      .header {
        margin-bottom: 38px;
      }

      .menu {
        grid-template-columns: 1fr;

        gap: 16px;
      }

      .menu-card {
        min-height: 245px;

        padding:
          24px 22px;

        border-radius: 20px;
      }

      .card-number {
        top: 21px;
        left: 22px;
      }

      footer {
        margin-top: 45px;
      }
    }

  </style>
</head>


<body>

  <!-- Aurora background -->
  <div class="aurora-bg">

    <div
      class="aurora-light light-1"
    ></div>

    <div
      class="aurora-light light-2"
    ></div>

    <div
      class="aurora-light light-3"
    ></div>

  </div>


  <main class="page">


    <!-- ======================================
         HEADER
         ====================================== -->

    <header class="header">

      <div class="brand">
        STARGLOW
      </div>

      <h1 class="main-title">
        Aurora
      </h1>

      <div class="subtitle">
        UNOFFICIAL FAN SITE
      </div>

    </header>


    <!-- ======================================
         MENU
         ====================================== -->

    <section class="menu">


      <!-- ALBUM -->

      <a
        href="album.html"
        class="menu-card album-card"
      >

        <div class="card-number">
          01
        </div>

        <div class="card-label">
          1st Album
        </div>

        <div class="card-title">
          “Aurora”
        </div>

        <div class="card-subtitle">
          Release Information
        </div>

        <div class="enter">

          <span>
            ENTER
          </span>

          <span class="arrow">
            →
          </span>

        </div>

      </a>


      <!-- TOUR -->

      <a
        href="tour.html"
        class="menu-card tour-card"
      >

        <div class="card-number">
          02
        </div>

        <div class="card-label">
          1st Arena Tour
        </div>

        <div class="card-title">
          Aurora<br>
          - The Dawn -
        </div>

        <div class="card-subtitle">
          Tour Information
        </div>

        <div class="enter">

          <span>
            ENTER
          </span>

          <span class="arrow">
            →
          </span>

        </div>

      </a>


    </section>


    <!-- ======================================
         FOOTER
         ====================================== -->

    <footer>
      非公式ファンサイト
    </footer>


  </main>

</body>

</html>
