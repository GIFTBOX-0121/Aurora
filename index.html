<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#070c1b;color:#f7f6ff;font-family:Arial,"Helvetica Neue",sans-serif;overflow-x:hidden}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#202344 0%,#10152f 45%,#050917 100%)}
.aurora-field{position:absolute;inset:-20% -25%;filter:blur(25px);opacity:.82;transform:rotate(-12deg)}
.curtain{position:absolute;top:-35%;height:150%;width:35%;border-radius:50%;mix-blend-mode:screen;transform-origin:50% 20%;filter:blur(27px);animation:wave 17s ease-in-out infinite alternate;background:linear-gradient(90deg,transparent 0%,rgba(77,139,238,.02) 12%,rgba(76,219,206,.46) 34%,rgba(157,129,255,.6) 56%,rgba(104,169,250,.34) 76%,transparent 100%)}
.curtain:nth-child(1){left:3%;animation-duration:16s}.curtain:nth-child(2){left:27%;animation-delay:-7s;animation-duration:21s;opacity:.85}.curtain:nth-child(3){left:52%;animation-delay:-12s;animation-duration:19s;opacity:.7}.curtain:nth-child(4){left:75%;animation-delay:-4s;animation-duration:24s;opacity:.65}
.horizon{position:absolute;inset:25% -20% -35%;background:radial-gradient(ellipse at 52% 30%,rgba(100,109,235,.2),transparent 60%);animation:breathe 13s ease-in-out infinite alternate}
@keyframes wave{0%{transform:translateX(-16%) skewX(-16deg) scaleX(.75) rotate(-5deg)}50%{transform:translateX(10%) skewX(9deg) scaleX(1.25) rotate(5deg)}100%{transform:translateX(-4%) skewX(-8deg) scaleX(.92) rotate(-3deg)}}@keyframes breathe{to{transform:scale(1.15);opacity:.5}}
.stars{position:absolute;inset:0}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 9px 2px #c6d9ff;animation:twinkle var(--duration) ease-in-out infinite;animation-delay:var(--delay)}.star.bright{width:3px;height:3px;box-shadow:0 0 15px 3px #e0e9ff}@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.65)}50%{opacity:1;transform:scale(1.8)}}
main{max-width:940px;margin:auto;padding:95px 22px 65px;text-align:center}.hero{margin-bottom:72px}.title-wrap{position:relative;display:table;margin:0 auto;padding-top:0}.star-drawing{display:block;position:relative;pointer-events:none;width:112px;height:104px;margin:0 auto 13px;overflow:visible;filter:drop-shadow(0 0 9px rgba(182,210,255,.7))}.star-drawing .star-halo{fill:none;stroke:#c9c0ff;stroke-width:9;stroke-linejoin:round;stroke-linecap:round;opacity:.28;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw-star 9s ease-in-out infinite}.star-drawing .star-trace{fill:none;stroke:#fff8dd;stroke-width:2.7;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw-star 9s ease-in-out infinite}.star-drawing .star-tip{fill:#fff;filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 12px #b3bcff);animation:tip-show 9s linear infinite}.star-drawing .star-flash{transform-origin:250px 24px;animation:star-flash 9s ease-in-out infinite}@keyframes draw-star{0%,7%{stroke-dashoffset:1000;opacity:0}10%{opacity:1}43%,60%{stroke-dashoffset:0;opacity:1}74%,100%{stroke-dashoffset:0;opacity:0}}@keyframes tip-show{0%,7%,44%,100%{opacity:0}10%,42%{opacity:1}}@keyframes star-flash{0%,40%,70%,100%{opacity:0;transform:scale(.5)}45%,53%{opacity:1;transform:scale(1.2)}}.hero h1{margin:0;font-family:Georgia,serif;font-size:clamp(66px,13vw,132px);font-weight:400;letter-spacing:.045em;text-shadow:0 0 45px rgba(176,171,255,.7)}.subtitle{margin-top:10px;font-size:11px;letter-spacing:.3em;color:#e4e5fa}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{display:flex;min-height:270px;flex-direction:column;justify-content:center;align-items:center;padding:30px;border:1px solid rgba(236,238,255,.42);border-radius:20px;color:#fff;text-decoration:none;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(20,27,65,.25));-webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);box-shadow:0 12px 40px rgba(2,4,20,.15);transition:transform .3s,border-color .3s,background .3s}.card:hover,.card:focus-visible{transform:translateY(-5px);border-color:#e6dcff;background:rgba(255,255,255,.24)}.card small{display:block;color:#e5ecff;letter-spacing:.12em;font-size:clamp(13px,2vw,16px);font-weight:700;line-height:1.7;text-shadow:0 0 12px rgba(180,200,255,.55)}.card h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(30px,4vw,44px);margin:20px 0 0;line-height:1.2}.cafe{display:block;margin-top:20px;padding:22px;border:1px solid rgba(255,255,255,.35);border-radius:14px;color:#f5f3ff;text-decoration:none;background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);letter-spacing:.15em;font-size:13px}.cafe:hover,.cafe:focus-visible{background:rgba(255,255,255,.18)}footer{margin-top:65px;color:#bfc9e6;font-size:11px;letter-spacing:.1em}
@media(max-width:600px){main{padding-top:105px}.menu{grid-template-columns:1fr}.card{min-height:210px}.hero{margin-bottom:60px}.title-wrap{padding-top:0}.star-drawing{width:92px;height:86px;margin-bottom:12px}.aurora-field{inset:-20% -45%;filter:blur(21px)}.curtain{width:50%}}
@media(prefers-reduced-motion:reduce){.curtain,.horizon,.star,.star-drawing *{animation:none}.star-drawing{display:none}.card{transition:none}}
</style>
