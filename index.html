
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d20">
  <title>Aurora | UNOFFICIAL FAN SITE</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #f5f4ff;
      font-family: Arial, "Helvetica Neue", sans-serif;
      background: #080d20;
      overflow-x: hidden;
    }

    .sky {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(
        180deg, #06091b 0%, #121c3a 65%, #211936 100%
      );
    }
    .aurora {
      position: absolute;
      width: 130%;
      height: 70%;
      left: -15%;
      top: -10%;
      border-radius: 50%;
      filter: blur(65px);
      opacity: .48;
      background: conic-gradient(
        from 30deg,
        transparent,
        #536bc2,
        #9a77db,
        #78c4d2,
        transparent
      );
      animation: drift 17s ease-in-out infinite alternate;
    }
    .aurora.two {
      top: 20%;
      left: 10%;
      opacity: .24;
      animation-duration: 24s;
      animation-direction: alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(-8%, -5%) rotate(-9deg) scale(1); }
      to { transform: translate(9%, 8%) rotate(12deg) scale(1.2); }
    }

    .stars {
      position: absolute;
      inset: 0;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 8px 2px #c8d8ff;
      animation: twinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.6); }
      50% { opacity: 1; transform: scale(1.6); }
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 85px 20px 65px;
      text-align: center;
    }
    .hero { margin-bottom: 65px; }
    .hero h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(64px, 13vw, 125px);
      font-weight: 400;
      letter-spacing: .045em;
      text-shadow: 0 0 45px #b3a7ff88;
    }
    .subtitle {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: .3em;
      color: #d5d8ec;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .card {
      display: flex;
      min-height: 260px;
      flex-direction: column;
      justify-content: center;
      padding: 30px;
      border: 1px solid #ffffff44;
      border-radius: 18px;
      color: white;
      text-decoration: none;
      background: linear-gradient(
        135deg, #ffffff24, #ffffff08
      );
      backdrop-filter: blur(12px);
      transition: transform .3s, background .3s;
    }
    .card:hover {
      transform: translateY(-6px);
      background: #ffffff25;
    }
    .card small {
      color: #d0d8f8;
      letter-spacing: .2em;
      font-size: 11px;
    }
    .card h2 {
      font-family: Georgia, serif;
      font-weight: 400;
      font-size: clamp(28px, 4vw, 42px);
      margin: 20px 0;
    }
    .card span { font-size: 12px; color: #d9def1; }
    .cafe {
      display: block;
      margin-top: 20px;
      padding: 22px;
      border: 1px solid #ffffff35;
      border-radius: 14px;
      color: #f2f1ff;
      text-decoration: none;
      background: #ffffff0c;
      letter-spacing: .15em;
      font-size: 13px;
    }
    footer {
      margin-top: 65px;
      color: #aab4d0;
      font-size: 11px;
      letter-spacing: .1em;
    }
    @media (max-width: 600px) {
      main { padding-top: 100px; }
      .menu { grid-template-columns: 1fr; }
      .card { min-height: 205px; }
      .hero { margin-bottom: 55px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .aurora, .star { animation: none; }
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="aurora"></div>
    <div class="aurora two"></div>
    <div class="stars" id="stars"></div>
  </div>

  <main>
    <header class="hero">
      <h1>Aurora</h1>
      <div class="subtitle">UNOFFICIAL FAN SITE</div>
    </header>

    <nav class="menu" aria-label="メインメニュー">
      <a class="card" href="album.html">
        <small>STARGLOW 1ST ALBUM</small>
        <h2>Aurora</h2>
        <span>ALBUM INFORMATION ↗</span>
      </a>
      <a class="card" href="tour.html">
        <small>STARGLOW 1ST ARENA TOUR</small>
        <h2>Aurora<br>- The Dawn -</h2>
        <span>TOUR INFORMATION ↗</span>
      </a>
    </nav>

    <a class="cafe" href="cafe.html">
      ☕ COLLABORATION CAFE ↗
    </a>

    <footer>
      UNOFFICIAL FAN SITE
    </footer>
  </main>

  <script>
    const container = document.getElementById("stars");
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < 100; i++) {
      const star = document.createElement("span");
      star.className = "star";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.setProperty(
        "--duration", (2 + Math.random() * 5) + "s"
      );
      star.style.setProperty(
        "--delay", (-Math.random() * 7) + "s"
      );
      fragment.appendChild(star);
    }
    container.appendChild(fragment);
  </script>
</body>
</html>
